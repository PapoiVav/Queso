<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Papoi v1.02.7</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background-color: #0c0811;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
            overflow: hidden;
            user-select: none;
        }

        #ui-bar {
            width: 100%;
            max-width: 600px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            flex-shrink: 0;
        }

        .hp-background {
            width: 50%;
            height: 16px;
            background: #222;
            border-radius: 9px;
            overflow: hidden;
            border: 1px solid #444;
        }

        #hp-bar {
            width: 100%;
            height: 100%;
            background: #00ffff;
            transition: width 0.1s linear;
        }

        #phase-text {
            font-size: 0.85rem;
            font-weight: bold;
            min-width: 130px;
            text-align: right;
        }

        #game-container {
            position: relative;
            width: min(600px, 85vw, 80vh);
            height: min(600px, 85vw, 80vh);
        }

        canvas {
            width: 100%;
            height: 100%;
            background-color: #050308;
            border: 2px solid #3d1e4e;
            border-radius: 12px;
            box-shadow: 0 0 25px rgba(255, 0, 85, 0.2);
            display: block;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 3, 8, 0.92);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            padding: 15px;
            text-align: center;
        }

        h1 {
            color: #00ffff;
            margin-bottom: 15px;
            font-size: clamp(1.2rem, 3vw, 1.8rem);
            text-shadow: 0 0 10px #00ffff;
        }

        .diff-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn-diff {
            background: #1a1026;
            color: #ffffff;
            border: 2px solid #3d1e4e;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: clamp(0.85rem, 2vw, 1rem);
            font-weight: bold;
            transition: all 0.2s;
        }

        .btn-diff:hover {
            border-color: #00ffff;
            box-shadow: 0 0 10px #00ffff;
        }

        .btn-sigma {
            background: #001122;
            color: #00ffff;
            border: 2px solid #00d8ff;
            box-shadow: 0 0 15px #00ffff, inset 0 0 15px #0088ff;
            animation: blueFlame 1.2s infinite alternate ease-in-out;
        }

        @keyframes blueFlame {
            0% { box-shadow: 0 0 10px #0088ff, 0 -5px 15px #00ffff; }
            50% { box-shadow: 0 0 20px #00ffff, 0 -12px 25px #0088ff; }
            100% { box-shadow: 0 0 12px #0055ff, 0 -8px 18px #00d8ff; }
        }

        .desc-box {
            font-size: clamp(0.75rem, 1.8vw, 0.95rem);
            color: #aaaaaa;
            min-height: 25px;
            text-align: center;
            padding: 0 10px;
            font-style: italic;
        }

        .restart-btn {
            background: #ff0055;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }

        #toast-notification {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            background: rgba(5, 3, 8, 0.95);
            border: 2px solid #00ffff;
            color: #00ffff;
            padding: 15px 25px;
            border-radius: 12px;
            font-size: clamp(1.1rem, 3vw, 1.6rem);
            font-weight: bold;
            box-shadow: 0 0 30px #00ffff;
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
            z-index: 20;
            text-align: center;
            width: 80%;
        }

        #toast-notification.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }
    </style>
</head>
<body>

    <div id="ui-bar">
        <div id="lives-ui">❤️❤️❤️❤️❤️❤️</div>
        <div class="hp-background" id="hp-container">
            <div id="hp-bar"></div>
        </div>
        <div id="hp-text">100%</div>
        <div id="phase-text"></div>
    </div>

    <div id="game-container">
        <div id="toast-notification"></div>

        <div id="diff-screen" class="overlay">
            <h1>SELECCIONÁ DIFICULTAD</h1>
            <div class="diff-selector">
                <button class="btn-diff" onmouseenter="showDesc('algo muy fácil, podrías completarlo sin jugar')" onclick="selectDifficulty('easy')">FÁCIL</button>
                <button class="btn-diff" onmouseenter="showDesc('dificultad estándar')" onclick="selectDifficulty('normal')">NORMAL</button>
                <button class="btn-diff" onmouseenter="showDesc('no sé porqué querrías jugar esto')" onclick="selectDifficulty('hard')">DIFÍCIL</button>
                <button id="btn-sigma-secret" class="btn-diff btn-sigma" style="display: none;" onmouseenter="showDesc('solo los más sigmas son dignos de entrar')" onclick="selectDifficulty('sigma')">SIGMA</button>
            </div>
            <div id="diff-desc" class="desc-box">Pasá el mouse sobre una dificultad...</div>
        </div>

        <div id="game-overlay" class="overlay" style="display: none;">
            <h1 id="over-title">GAME OVER</h1>
            <p id="over-sub" style="text-align: center; max-width: 90%; line-height: 1.4;"></p>
            <button class="restart-btn" onclick="openDifficultyMenu()">VOLVER AL MENÚ</button>
        </div>

        <canvas id="gameCanvas" width="600" height="600"></canvas>
    </div>

    <script src="script.js"></script>
</body>
</html>
