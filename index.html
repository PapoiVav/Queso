<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Papoi v1.06.3</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="game-container">
        <!-- HUD Superior -->
        <div id="hud">
            <div id="hp-container">
                <div id="hp-bar"></div>
                <span id="hp-text">100%</span>
            </div>
            <div id="phase-text"></div>
            <div id="lives-ui">❤️❤️❤️❤️❤️❤️</div>
            <div id="bgm-ui">🎵 BGM: Active</div>
        </div>

        <!-- Canvas Principal -->
        <canvas id="gameCanvas" width="600" height="700"></canvas>

        <!-- Selector de Dificultad -->
        <div id="diff-screen" class="overlay">
            <h1>SELECCIONÁ DIFICULTAD</h1>
            <div class="diff-buttons">
                <button class="btn-diff" onclick="selectDifficulty('easy')">FÁCIL</button>
                <button class="btn-diff" onclick="selectDifficulty('normal')">NORMAL</button>
                <button class="btn-diff" onclick="selectDifficulty('hard')">DIFÍCIL</button>
                <button id="btn-sigma-secret" class="btn-diff sigma-btn" onclick="selectDifficulty('sigma')">⚡ MODO SIGMA ⚡</button>
            </div>
            <p id="diff-desc">Seleccioná un nivel para empezar</p>
        </div>

        <!-- Pantalla Game Over / Victoria -->
        <div id="game-overlay" class="overlay" style="display: none;">
            <h1 id="over-title">GAME OVER</h1>
            <p id="over-sub">Te has quedado sin vidas.</p>
            <button class="btn-restart" onclick="openDifficultyMenu()">MENÚ PRINCIPAL</button>
        </div>

        <!-- Notificaciones Toast -->
        <div id="toast-notification"></div>
    </div>

    <!-- Audio BGM opcional -->
    <audio id="bgm-audio" src="bgm.mp3" loop></audio>

    <script src="script.js"></script>
</body>
</html>
