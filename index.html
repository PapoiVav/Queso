<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego Papoi</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #0d0d11;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Contenedor principal ajustado para que quepa en cualquier pantalla */
        #game-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            max-height: 98vh;
            width: 100%;
            max-width: 620px;
            padding: 5px;
        }

        /* UI SUPERIOR: BARRA DE VIDA DEL JEFE */
        #boss-ui {
            width: 100%;
            margin-bottom: 6px;
            text-align: center;
        }

        #boss-info-header {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 3px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #hp-bar-bg {
            width: 100%;
            height: 16px;
            background-color: #22222e;
            border: 2px solid #444455;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        #hp-bar {
            width: 100%;
            height: 100%;
            background-color: #00ffff;
            transition: width 0.15s ease-out, background-color 0.3s;
        }

        /* CANVAS DEL JUEGO */
        #gameCanvas {
            background-color: #050508;
            border: 2px solid #333344;
            border-radius: 6px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
            /* Mantiene la proporción sin desbordar verticalmente */
            max-height: 80vh;
            width: auto;
        }

        /* UI INFERIOR: VIDAS DEL JUGADOR */
        #player-ui {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 6px;
            padding: 0 5px;
            font-size: 14px;
            font-weight: bold;
        }

        #lives-ui {
            font-size: 18px;
            letter-spacing: 2px;
        }

        /* PANTALLA DE GAME OVER / VICTORIA */
        #game-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 15, 0.88);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        #over-title {
            font-size: 42px;
            font-weight: 900;
            margin-bottom: 10px;
            text-shadow: 0 0 15px currentColor;
        }

        #over-sub {
            font-size: 16px;
            color: #cccccc;
            margin-bottom: 25px;
        }

        button {
            padding: 12px 28px;
            font-size: 16px;
            font-weight: bold;
            color: #ffffff;
            background: #ff0055;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.4);
            transition: transform 0.1s, background 0.2s;
        }

        button:hover {
            background: #ff2277;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div id="game-wrapper">
        <!-- Barra superior del Jefe -->
        <div id="boss-ui">
            <div id="boss-info-header">
                <span>CIRCULO MALVADO DE LA DESTRUCCION</span>
                <span id="phase-text"></span>
                <span id="hp-text">100%</span>
            </div>
            <div id="hp-bar-bg">
                <div id="hp-bar"></div>
            </div>
        </div>

        <!-- Lienzo del Juego -->
        <canvas id="gameCanvas" width="600" height="700"></canvas>

        <!-- Vidas del Jugador abajo -->
        <div id="player-ui">
            <span>JUGADOR BUENARDOPOLIS</span>
            <div id="lives-ui">❤️❤️❤️❤️❤️❤️</div>
        </div>
    </div>

    <!-- Pantalla Overlay al perder/ganar -->
    <div id="game-overlay">
        <div id="over-title">GAME OVER</div>
        <div id="over-sub">Te has quedado sin vidas.</div>
        <button onclick="restartGame()">JUGAR DE NUEVO</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
