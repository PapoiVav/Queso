<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego polis</title>
    <style>
        body {
            background-color: #0c0811;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        #game-container {
            position: relative;
            width: 600px;
            height: 600px;
        }

        canvas {
            background-color: #050308;
            border: 2px solid #3d1e4e;
            border-radius: 12px;
            box-shadow: 0 0 25px rgba(255, 0, 85, 0.2);
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 3, 8, 0.92);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        h1 {
            color: #00ffff;
            margin-bottom: 20px;
            text-shadow: 0 0 10px #00ffff;
        }

        .diff-selector {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }

        .btn-diff {
            background: #1a1026;
            color: #ffffff;
            border: 2px solid #3d1e4e;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            transition: all 0.2s;
        }

        .btn-diff:hover {
            border-color: #00ffff;
            box-shadow: 0 0 10px #00ffff;
        }

        .desc-box {
            font-size: 0.95rem;
            color: #aaaaaa;
            min-height: 30px;
            text-align: center;
            padding: 0 20px;
            font-style: italic;
        }

        #ui-bar {
            width: 600px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .hp-background {
            width: 70%;
            height: 18px;
            background: #222;
            border-radius: 9px;
            overflow: hidden;
            border: 1px solid #444;
        }

        #hp-bar {
            width: 100%;
            height: 100%;
            background: #00ffff;
            transition: width 0.1s linear;
        }

        .restart-btn {
            background: #ff0055;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div id="ui-bar">
        <div id="lives-ui">❤️❤️❤️❤️❤️❤️</div>
        <div class="hp-background">
            <div id="hp-bar"></div>
        </div>
        <div id="hp-text">100%</div>
    </div>

    <div id="game-container">
        <!-- Pantalla de Dificultad -->
        <div id="diff-screen" class="overlay">
            <h1>SELECCIONÁ DIFICULTAD</h1>
            <div class="diff-selector">
                <button class="btn-diff" onmouseenter="showDesc('algo muy fácil, podrías completarlo sin jugar')" onclick="selectDifficulty('easy')">FÁCIL</button>
                <button class="btn-diff" onmouseenter="showDesc('dificultad estándar')" onclick="selectDifficulty('normal')">NORMAL</button>
                <button class="btn-diff" onmouseenter="showDesc('no sé porqué querrías jugar esto')" onclick="selectDifficulty('hard')">DIFÍCIL</button>
            </div>
            <div id="diff-desc" class="desc-box">Pasá el mouse sobre una dificultad...</div>
        </div>

        <!-- Pantalla Game Over / Victoria Troll -->
        <div id="game-overlay" class="overlay" style="display: none;">
            <h1 id="over-title">GAME OVER</h1>
            <p id="over-sub" style="text-align: center; max-width: 80%; line-height: 1.5;"></p>
            <button class="restart-btn" onclick="openDifficultyMenu()">VOLVER AL MENÚ</button>
        </div>

        <canvas id="gameCanvas" width="600" height="600"></canvas>
    </div>

    <script src="script.js"></script>
</body>
</html>
